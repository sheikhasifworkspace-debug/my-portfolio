<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheikh Asif</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS Client CDN (kept for future use) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f5f7;
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --accent: #0071e3;
      --accent-light: #e8f4fd;
      --card-bg: #ffffff;
      --shadow-soft: 0 2px 20px rgba(0,0,0,0.06);
      --shadow-hover: 0 8px 40px rgba(0,0,0,0.1);
      --radius: 20px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ============================== */
    /* HERO SECTION                   */
    /* ============================== */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
    }

    .hero-inner {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    /* Left: Text */
    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Available badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid #e5e5ea;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-secondary);
      width: fit-content;
      box-shadow: var(--shadow-soft);

      /* Animation */
      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    /* Main heading */
    .hero-heading {
      font-size: clamp(40px, 6vw, 72px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -2.5px;
      color: var(--text-primary);
    }

    .hero-heading .line {
      display: block;
      overflow: hidden;
    }

    .hero-heading .line-inner {
      display: block;
      opacity: 0;
      transform: translateY(100%);
    }

    .hero-heading .line:nth-child(1) .line-inner {
      animation: textReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .hero-heading .line:nth-child(2) .line-inner {
      animation: textReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
    }

    .hero-heading .line:nth-child(3) .line-inner {
      animation: textReveal 1s cubic-bezier(0.16, 1, 0.3, 1) 0.7s forwards;
    }

    .hero-heading .name-highlight {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Sub text */
    .hero-sub {
      font-size: 17px;
      line-height: 1.65;
      color: var(--text-secondary);
      max-width: 440px;
      font-weight: 400;

      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
    }

    /* CTA Button */
    .hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--text-primary);
      color: #fff;
      padding: 16px 32px;
      border-radius: 100px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      width: fit-content;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);

      opacity: 0;
      transform: translateY(20px);
      animation: fadeSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
    }

    .hero-cta:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .hero-cta svg {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
    }

    .hero-cta:hover svg {
      transform: translateX(4px);
    }

    /* Right: Photo */
    .hero-photo {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .photo-wrapper {
      position: relative;
      width: 400px;
      height: 480px;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: var(--shadow-hover);

      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: photoReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Floating card decoration */
    .float-card {
      position: absolute;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;

      opacity: 0;
      animation: floatCardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .float-card.card-1 {
      top: -16px;
      right: -30px;
      animation-delay: 1.3s;
    }

    .float-card.card-2 {
      bottom: 40px;
      left: -40px;
      animation-delay: 1.5s;
    }

    .float-card .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .float-card .card-icon.purple { background: #f0e6ff; }
    .float-card .card-icon.blue { background: #e0f0ff; }

    /* ============================== */
    /* ANIMATIONS                     */
    /* ============================== */
    @keyframes fadeSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes photoReveal {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes floatCardIn {
      to {
        opacity: 1;
      }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .float-card.card-1 { animation: floatCardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.3s forwards, float 4s ease-in-out 2.1s infinite; }
    .float-card.card-2 { animation: floatCardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.5s forwards, float 5s ease-in-out 2.3s infinite; }

    /* ============================== */
    /* RESPONSIVE                     */
    /* ============================== */
    @media (max-width: 768px) {
      .hero-inner {
        grid-template-columns: 1fr;
        gap: 40px;
        text-align: center;
      }

      .hero-text {
        align-items: center;
      }

      .hero-sub {
        max-width: 100%;
      }

      .hero-heading {
        letter-spacing: -1.5px;
      }

      .photo-wrapper {
        width: 300px;
        height: 360px;
        border-radius: 24px;
      }

      .float-card.card-1 {
        right: -10px;
        top: -10px;
      }

      .float-card.card-2 {
        left: -10px;
        bottom: 30px;
      }

      .hero-photo {
        order: -1;
      }
    }

    @media (max-width: 480px) {
      .hero {
        padding: 40px 16px;
      }

      .photo-wrapper {
        width: 260px;
        height: 320px;
      }

      .float-card {
        padding: 10px 14px;
        font-size: 12px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
